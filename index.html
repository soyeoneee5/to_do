<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f1eb">
  <title>오늘의 할 일</title>
  <style>
    :root {
      --ink: #24221f;
      --muted: #817b72;
      --paper: rgba(255, 255, 255, 0.86);
      --line: #e4ded4;
      --accent: #e75b3e;
      --accent-dark: #c9452c;
      --green: #477a62;
      --shadow: 0 24px 70px rgba(61, 48, 36, 0.13);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 10% 15%, rgba(231, 91, 62, 0.12), transparent 24rem),
        radial-gradient(circle at 90% 85%, rgba(71, 122, 98, 0.13), transparent 26rem),
        #f4f1eb;
    }

    .app {
      width: min(100%, 680px);
      padding: clamp(28px, 6vw, 52px);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 32px;
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .app::before {
      content: "";
      width: 150px;
      height: 150px;
      position: absolute;
      top: -80px;
      right: -60px;
      border: 22px solid rgba(231, 91, 62, 0.1);
      border-radius: 50%;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", "Nanum Myeongjo", serif;
      font-size: clamp(2.25rem, 8vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.05em;
      line-height: 1.05;
    }

    .subtitle {
      margin: 14px 0 30px;
      color: var(--muted);
      line-height: 1.7;
    }

    .input-row {
      display: flex;
      gap: 10px;
      padding-bottom: 26px;
      border-bottom: 1px solid var(--line);
    }

    #todo-input {
      width: 100%;
      min-width: 0;
      padding: 15px 18px;
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      outline: none;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #todo-input::placeholder { color: #aaa39a; }

    #todo-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(231, 91, 62, 0.12);
    }

    #add-button {
      flex: 0 0 auto;
      padding: 0 24px;
      color: #fff;
      font: inherit;
      font-weight: 800;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(231, 91, 62, 0.22);
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    #add-button:hover {
      background: var(--accent-dark);
      box-shadow: 0 10px 22px rgba(231, 91, 62, 0.28);
      transform: translateY(-2px);
    }

    #add-button:active { transform: translateY(0); }

    .list-header {
      margin: 24px 2px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    #todo-count { font-weight: 700; }

    #todo-list {
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
      list-style: none;
    }

    .todo-item {
      min-height: 62px;
      padding: 10px 10px 10px 16px;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.72);
      animation: appear 0.25s ease both;
      transition: opacity 0.2s, border-color 0.2s, background 0.2s;
    }

    .todo-item.completed {
      border-color: rgba(71, 122, 98, 0.22);
      background: rgba(71, 122, 98, 0.07);
    }

    .todo-check {
      width: 21px;
      height: 21px;
      flex: 0 0 auto;
      accent-color: var(--green);
      cursor: pointer;
    }

    .todo-text {
      flex: 1;
      overflow-wrap: anywhere;
      line-height: 1.5;
      transition: color 0.2s;
    }

    .completed .todo-text {
      color: #9b958c;
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .delete-button {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: #a49d94;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      background: transparent;
      transition: color 0.2s, background 0.2s;
    }

    .delete-button:hover {
      color: var(--accent);
      background: rgba(231, 91, 62, 0.1);
    }

    .empty-state {
      padding: 34px 20px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 17px;
    }

    .empty-state span {
      display: block;
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      body { padding: 16px; }
      .app { padding: 28px 20px; border-radius: 24px; }
      .input-row { flex-direction: column; }
      #add-button { min-height: 52px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">My daily list</p>
    <h1>오늘의 할 일</h1>
    <p class="subtitle">해야 할 일을 가볍게 적고, 하나씩 완료해 보세요.</p>

    <form id="todo-form" class="input-row">
      <input
        id="todo-input"
        type="text"
        placeholder="예: 오후 3시 회의 준비"
        aria-label="새 할 일"
        autocomplete="off"
        maxlength="120"
      >
      <button id="add-button" type="submit">추가</button>
    </form>

    <div class="list-header">
      <span>할 일 목록</span>
      <span id="todo-count" aria-live="polite">남은 할 일 0개</span>
    </div>
    <ul id="todo-list"></ul>
  </main>

  <script>
    const STORAGE_KEY = "daily-todos";
    const form = document.querySelector("#todo-form");
    const input = document.querySelector("#todo-input");
    const list = document.querySelector("#todo-list");
    const count = document.querySelector("#todo-count");

    let todos = loadTodos();

    function loadTodos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function renderTodos() {
      list.replaceChildren();

      if (todos.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        empty.innerHTML = "<span aria-hidden=\"true\">✓</span>아직 등록된 할 일이 없어요.";
        list.append(empty);
      } else {
        todos.forEach((todo) => {
          const item = document.createElement("li");
          item.className = `todo-item${todo.completed ? " completed" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.className = "todo-check";
          checkbox.type = "checkbox";
          checkbox.checked = todo.completed;
          checkbox.setAttribute("aria-label", `${todo.text} 완료 표시`);
          checkbox.addEventListener("change", () => toggleTodo(todo.id));

          const text = document.createElement("span");
          text.className = "todo-text";
          text.textContent = todo.text;

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-button";
          deleteButton.type = "button";
          deleteButton.setAttribute("aria-label", `${todo.text} 삭제`);
          deleteButton.innerHTML = `
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path><path d="M8 6V4h8v2"></path>
              <path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v5M14 11v5"></path>
            </svg>`;
          deleteButton.addEventListener("click", () => deleteTodo(todo.id));

          item.append(checkbox, text, deleteButton);
          list.append(item);
        });
      }

      const remaining = todos.filter((todo) => !todo.completed).length;
      count.textContent = `남은 할 일 ${remaining}개`;
    }

    function addTodo(text) {
      todos.unshift({ id: crypto.randomUUID(), text, completed: false });
      saveTodos();
      renderTodos();
    }

    function toggleTodo(id) {
      todos = todos.map((todo) =>
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      );
      saveTodos();
      renderTodos();
    }

    function deleteTodo(id) {
      todos = todos.filter((todo) => todo.id !== id);
      saveTodos();
      renderTodos();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      addTodo(text);
      input.value = "";
      input.focus();
    });

    renderTodos();
  </script>
</body>
</html>
